<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>首尾相乘拆項分組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 方格筆記風：16:9 固定舞台（1280×720）自動縮放；上方題目列／中央板書＋草稿／下方引導區 */
:root{
  --paper:#FBFCFE; --grid:#E3E9F2; --frame:#CBD5E1; --ink:#1F2937; --ink2:#475569;
  --blue:#1D4ED8; --blue-soft:#EFF4FF; --accent:#C2410C; --sheet:#FFFFFF;
  --ok:#15803D; --ok-bg:#F0FDF4; --bad:#B91C1C; --bad-bg:#FEF2F2; --hint-bg:#FFF7ED;
  --g1:#1D4ED8; --g2:#C2410C;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --math:"Cambria Math","Times New Roman",Times,serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
#vp{position:fixed;inset:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;display:flex;flex-direction:column}
.view{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;padding:14px 18px;box-sizing:border-box}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.btn{min-height:52px;padding:0 24px;border-radius:10px;font-size:20px;font-weight:700;border:2px solid var(--blue)}
.btn.primary{background:var(--blue);color:#fff}
.btn.secondary{background:#fff;color:var(--blue)}
.btn.small{min-height:40px;font-size:16px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--blue);font-size:15px;text-decoration:underline;padding:4px;justify-self:end}
.panel{background:var(--sheet);border:2px solid var(--frame);border-radius:12px}

/* ---------- 登入 ---------- */
#login{align-items:center;justify-content:center}
.login-card{width:620px;padding:30px 36px;display:flex;flex-direction:column;gap:16px}
.login-card h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.02em}
.login-card .sub{margin:0;color:var(--ink2);font-size:18px}
.login-card .sample{font-family:var(--math);font-size:26px;color:var(--ink)}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink2);font-weight:500}
.field input{height:48px;font-size:22px;border:2px solid var(--frame);border-radius:8px;padding:0 12px;width:140px;font-family:var(--sans);color:var(--ink)}
.field input.wide{width:520px;font-size:16px}
details{border-top:1px dashed var(--frame);padding-top:10px;color:var(--ink2);font-size:15px}
#teacher details{border:2px solid var(--frame);border-radius:12px;background:var(--sheet);padding:8px 16px}
#teacher details[open]{max-height:300px;overflow:auto}
summary{cursor:pointer;font-weight:700;color:var(--blue)}
.small-note{font-size:14px;color:var(--ink2);line-height:1.6;margin:6px 0}
.copyrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.copyrow code{flex:1;min-width:0;font-size:13px;background:var(--blue-soft);padding:8px;border-radius:6px;word-break:break-all;color:var(--ink)}
.err{color:var(--bad);font-size:16px;min-height:22px;font-weight:700}

/* ---------- 學生：上方題目列 ---------- */
.top{display:flex;align-items:center;gap:14px;height:64px;padding:0 12px}
.brand{display:flex}
.modes{display:flex;gap:6px}
.modes button{white-space:nowrap;height:38px;padding:0 8px;border-radius:8px;border:2px solid var(--frame);background:#fff;color:var(--ink2);font-size:15px;font-weight:700}
.modes button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.chips{flex:1;display:flex;gap:6px;list-style:none;margin:0;padding:0;justify-content:center}
.chips li{display:flex;align-items:center;gap:4px;height:36px;padding:0 7px;border-radius:18px;font-size:13px;color:var(--ink2);border:2px solid var(--frame);background:#fff;white-space:nowrap}
.chips li .n{font-weight:900}
.chips li.done{border-color:var(--ok);color:var(--ok)}
.chips li.cur{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
.me{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:8px;row-gap:2px;font-size:13px;color:var(--ink2);white-space:nowrap}
.me #meSeat{font-weight:900;color:var(--ink);font-size:18px}
.conn:empty{display:none}
.conn{font-size:13px;padding:3px 8px;border-radius:10px;border:1px solid var(--frame)}
.conn.ok{color:var(--ok);border-color:var(--ok)}
.conn.bad{color:var(--bad);border-color:var(--bad)}

/* ---------- 學生：中央板書 ---------- */
.board{flex:1;display:grid;grid-template-columns:1fr 430px;min-height:0;overflow:hidden}
.board.ch{grid-template-columns:1fr 1fr}
.board.ch #notes{flex:1;min-height:0}
.chips li.skip{border-style:dashed;color:var(--ink2)}
.chips li.miss{border-color:var(--bad);color:var(--bad)}
.chlab{font-size:18px;font-weight:700;color:var(--blue)}
.chtip{font-size:17px;color:var(--ink2);margin:0;line-height:1.6}
.chsum{font-size:26px;font-weight:700;line-height:1.6}
.chlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:16px;color:var(--ink2)}
.chlist>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chlist .okm{color:var(--ok);font-weight:700}
.chlist .skm{color:var(--ink2)}
input.blank:disabled{background:var(--ok-bg);border-color:var(--ok);border-style:solid;color:var(--ink)}
.pad{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.padbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.padbar button{height:40px;min-width:48px;padding:0 10px;border-radius:8px;border:2px solid var(--frame);background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.padbar button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.padbar .dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.padbar .sp{flex:1}
#pad{flex:1;width:100%;min-height:0;border:2px solid var(--frame);border-radius:8px;touch-action:none;cursor:crosshair;
  background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.lines{padding:22px 30px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:auto}
.ln{font-size:40px;line-height:1.5;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln input,.note input{vertical-align:middle;margin:0 2px}
.lines.compact{gap:8px;padding-top:14px}
.lines.compact .ln{font-size:32px;line-height:1.35}
.lines.compact .ln.l0{font-size:36px}
.cover{font-size:22px;line-height:1.6;color:var(--ink2);border:2px dashed var(--frame);border-radius:10px;padding:18px 20px;background:repeating-linear-gradient(45deg,#F8FAFC 0 10px,#EEF2F7 10px 20px)}
.ln .eq{display:inline-block;width:46px;color:var(--ink2)}
.ln.l0{font-size:46px;font-weight:500}
.ln.cur{background:var(--blue-soft);border-radius:10px;margin:0 -12px;padding:4px 12px}
i.v{font-family:var(--math);font-style:italic;font-size:1.08em;padding:0 .04em}
sup{font-size:.6em}
.hl{border:3px solid var(--accent);border-radius:999px;padding:0 .18em}
.u1{border-bottom:5px solid var(--g1);padding-bottom:2px}
.u2{border-bottom:5px solid var(--g2);padding-bottom:2px}
.grp{display:inline-block;padding-bottom:4px}
.grp.g1{border-bottom:5px solid var(--g1)}
.grp.g2{border-bottom:5px solid var(--g2)}
input.blank{width:76px;height:54px;font-size:32px;text-align:center;font-family:var(--sans);font-weight:700;color:var(--ink);
  border:2px dashed var(--blue);border-radius:8px;background:#fff;padding:0;box-sizing:border-box}
input.blank.sm{width:64px;height:44px;font-size:24px}
input.blank.mono{width:92px}
input.blank:not(:placeholder-shown){border-style:solid}
input.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.draft{border-left:2px dashed var(--frame);padding:16px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto;background:var(--sheet)}
.draft h3{margin:0;font-size:15px;color:var(--ink2);letter-spacing:.2em}
.note{font-size:21px;line-height:1.6;padding:8px 10px;border-radius:8px;border:1px solid var(--frame)}
.note .nrow{margin-top:4px}
.note.cur{border:2px solid var(--blue);background:var(--blue-soft)}
.note .nl{display:block;font-size:15px;font-weight:700;color:var(--ink2)}
.note.done{color:var(--ink2);font-size:18px}
.note.done .nl{display:none}
.cross{display:flex;flex-direction:column;gap:6px}
.cross svg{width:100%;height:auto}
.cross .crow{display:flex;align-items:center;gap:6px;font-size:19px}
.concept{border:2px solid var(--ok);background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:17px;line-height:1.6;color:var(--ink)}
.concept b{color:var(--ok)}

/* ---------- 學生：下方引導區 ---------- */
.guide{height:128px;display:flex;gap:16px;align-items:center;padding:0 18px}
.gtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.instr{font-size:21px;font-weight:700;line-height:1.4}
.instr .step{color:var(--blue)}
.fb{font-size:18px;line-height:1.45;min-height:26px;border-radius:8px;padding:6px 10px}
.fb:empty{padding:0}
.fb.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--hint-bg);color:#7C2D12}
.fb.info{background:var(--blue-soft);color:var(--blue)}
.gbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}

/* ---------- 教師看板 ---------- */
.ttop{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px}
.ttop h2{margin:0;font-size:22px;font-weight:900}
.ttop .room{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink2)}
.ttop .room input{width:90px;height:36px;font-size:18px;border:2px solid var(--frame);border-radius:8px;padding:0 8px}
.ttop .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:14px;color:var(--ink2);font-weight:700;letter-spacing:.06em}
.kpi .v{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:14px;color:var(--ink2)}
.kpi .v.txt{font-size:21px;line-height:1.3}
.cards{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start;padding:2px}
.card{background:var(--sheet);border:2px solid var(--frame);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink2)}
.card .h{display:flex;align-items:baseline;gap:8px}
.card .seat{font-size:22px;font-weight:900;color:var(--ink)}
.card .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.card .rate{font-size:20px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.card .pos{color:var(--ink);font-weight:500}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.card .cnt{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.card .mis{min-height:20px}
.card .flag{font-size:13px;font-weight:900;padding:1px 8px;border-radius:8px}
.card.alert{border:4px solid var(--bad)}
.card.alert .flag{background:var(--bad);color:#fff}
.card.idle{border-style:dashed;border-color:var(--ink2)}
.card.idle .flag{border:1px dashed var(--ink2);color:var(--ink2)}
.card.demo .nm::after{content:"（範例）";color:var(--ink2)}
.empty{grid-column:1/-1;padding:40px;text-align:center;font-size:18px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="vp"><div id="stage">

<!-- 登入 -->
<section id="login" class="view">
  <div class="login-card panel">
    <h1>首尾相乘・拆項分組</h1>
    <p class="sub">首項係數不是 1 的十字交乘因式分解，例如 <span class="sample">6<i class="v">x</i><sup>2</sup> + 7<i class="v">x</i> − 3</span></p>
    <div class="row">
      <label class="field">班級代碼<input id="inRoom" autocomplete="off" value="801"></label>

<script>
/* ================= 設定 ================= */
const FIREBASE_DB_URL = "https://cross-split-factoring-default-rtdb.asia-southeast1.firebasedatabase.app";   // 部署時可直接填入；也可在登入頁「連線設定」或網址 ?db= 指定
const FB_API_KEY = "AIzaSyCbB25e8Vhgohio1Wj1E5YLsHhk6K7syiw";   // Firebase 網頁 API 金鑰（公開識別碼，非密碼）
const TEACHER_EMAIL = "ghsghs1@gmail.com"; // 教師帳號（Firebase Authentication）
const IDLE_MS = 3*60*1000, ACTIVE_MS = 2*60*1000;
const STEP_NAMES = ['首尾相乘','找兩數','拆中間項','分組提公因式','提出共同括號','乘開檢查','回頭看'];
const MODE_NAMES = {example:'例題',swap:'換順序挑戰',practice:'隨機練習',challenge:'真實挑戰'};
const MISC = {
  M1:'首尾相乘只看常數項', M2:'乘積或和的正負號', M3:'找兩數：和或積不符', M4:'拆項沒用找到的兩數',
  M5:'提公因式漏變號', M6:'公因式沒提完或提錯', M7:'提出共同括號組合錯', M8:'乘開計算錯誤', M9:'十字斜乘位置錯', C1:'挑戰：中間項不符', C2:'挑戰：首項或常數項不符'
};
const $ = s => document.querySelector(s);
const MINUS = '−';
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

/* ================= 縮放 ================= */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit); fit();

/* ================= 數學格式 ================= */
const num = n => n<0 ? MINUS+Math.abs(n) : String(n);
const paren = n => n<0 ? '('+num(n)+')' : String(n);
const X = (sq) => `<i class="v">x</i>${sq?'<sup>2</sup>':''}`;
function term(coef,deg,first){
  if(!coef) return '';
  const ab=Math.abs(coef);
  const sign = coef<0 ? (first?MINUS:` ${MINUS} `) : (first?'':' + ');
  const body = deg===0 ? String(ab) : (ab===1?'':ab)+X(deg===2);
  return sign+body;
}
function poly(c2,c1,c0){let o='',f=true;[[c2,2],[c1,1],[c0,0]].forEach(([c,d])=>{if(c){o+=term(c,d,f);f=false;}});return o||'0';}
const monoText = f => f.d ? (f.k===1?'':f.k===-1?MINUS:num(f.k))+'x' : num(f.k);
const bin = (u,v) => '('+poly(0,u,v)+')';
function factorStr(k,d,first){ // 公因式顯示：-1 → "−"、1 → "+"
  if(d===0 && Math.abs(k)===1) return k<0 ? (first?MINUS:` ${MINUS} `) : (first?'':' + ');
  return term(k,d,first);
}
const plain = s => s.replace(/<sup>2<\/sup>/g,'²').replace(/<[^>]+>/g,'');
const gcd = (a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

/* ================= 輸入解析 ================= */
function norm(s){return String(s||'').replace(/\s+/g,'').replace(/[−–—﹣－]/g,'-').replace(/＋/g,'+').replace(/[Ｘ]/g,'x').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).toLowerCase();}
function pInt(s){s=norm(s);return /^[+-]?\d+$/.test(s)?parseInt(s,10):null;}
function pMono(s){
  s=norm(s); const m=s.match(/^([+-]?)(\d*)(x?)$/); if(!m||s==='') return null;
  if(!m[2] && !m[3] && !m[1]) return null;
  const k=(m[1]==='-'?-1:1)*(m[2]?parseInt(m[2],10):1);
  if(m[2]&&parseInt(m[2],10)===0) return null;
  return {k,d:m[3]?1:0};
}

/* ================= 題目 ================= */
const EXAMPLE={a:6,b:7,c:-3};
function rint(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}
function genProblem(prev){
  for(let t=0;t<20000;t++){
    const a=rint(2,20); const ds=[]; for(let p=1;p<=a;p++) if(a%p===0) ds.push(p);
    const p=ds[rint(0,ds.length-1)], r=a/p;
    const q=rint(-20,20), s=rint(-20,20); if(!q||!s) continue;
    if(gcd(p,q)!==1||gcd(r,s)!==1) continue;
    const b=p*s+q*r, c=q*s;
    if(!b||Math.abs(b)>20||Math.abs(c)>20) continue;
    if(prev&&prev.a===a&&prev.b===b&&prev.c===c) continue;
    return {a,b,c};
  }
  return {...EXAMPLE};
}
function pairOf(P){ // 相乘 ac、相加 b 的兩整數
  const ac=P.a*P.c;
  for(let m=-Math.abs(ac);m<=Math.abs(ac);m++){ if(m===0) continue; if(ac%m===0 && m+ac/m===P.b) return [m,ac/m]; }
  return null;
}

let lastOrder=null;   // 例題中學生寫在後面的數，換順序挑戰用

function newRound(mode,keepProb){
  if(mode==='challenge') return startChallenge();
  const prob = keepProb ? S.prob : (mode==='example' ? {...EXAMPLE} : mode==='practice' ? genProblem(S&&S.prob) : (S?S.prob:{...EXAMPLE}));
  const pr=pairOf(prob);
  let forceFirst=null;
  if(mode==='swap'){ forceFirst = (lastOrder && lastOrder.key===key(prob)) ? lastOrder.second : Math.min(pr[0],pr[1]); }
  S={mode,prob,step:1,ac:prob.a*prob.c,pair:pr,forceFirst,done:false};
  hintIdx=0; render(); setFb('',''); post();
}
const key = P => P.a+','+P.b+','+P.c;

const OK='✓ ', NG='✗ ';

/* ================= 檢查 ================= */
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function markBad(ids){document.querySelectorAll('input.blank').forEach(i=>i.classList.toggle('bad',ids.includes(i.id)));}
function need(ids){ // 是否都填了
  const miss=ids.filter(id=>norm(val(id))==='');
  if(miss.length){markBad(miss);setFb('info','還有空格沒填喔。');return false;}
  return true;
}
function check(){
  if(S.mode==='challenge') return checkChallenge();
  const st=S.step, {a,b,c}=S.prob, ac=S.ac; let r;
  if(st===1){
    if(!need(['ac'])) return; const v=pInt(val('ac')); if(v===null) return fmtErr(['ac']);
    if(v===ac) r={ok:1,msg:`首尾相乘是 ${num(ac)}。`};
    else if(v===c) r={misc:'M1',bad:['ac'],msg:`${num(c)} 只是常數項。「首尾相乘」要用哪兩個數相乘呢？首項的係數有沒有乘進去？`};
    else if(v===-ac) r={misc:'M2',bad:['ac'],msg:`數字對了，正負號再想想：${num(a)} 和 ${num(c)} 的正負號相同還是不同？相乘後是正還是負？`};
    else if(v===a) r={misc:'M1',bad:['ac'],msg:`${a} 是首項係數，還要乘上誰？`};
    else r={misc:'M1',bad:['ac'],msg:`再算一次：首項係數 × 常數項，連正負號一起看，結果是多少？`};
  }
  else if(st===2){
    if(!need(['p1','p2'])) return; const u=pInt(val('p1')), w=pInt(val('p2')); if(u===null||w===null) return fmtErr(['p1','p2']);
    if(u*w===ac && u+w===b){ S.found=[u,w]; r={ok:1,msg:`${num(u)} × ${paren(w)} = ${num(ac)}，${num(u)} + ${paren(w)} = ${num(b)}，找到了！`}; }
    else if(u*w===c && u+w===b) r={misc:'M1',bad:['p1','p2'],msg:`這兩數相乘是 ${num(c)}，那是常數項。第 1 步首尾相乘算出的是多少？應該用哪個數？`};
    else if(u*w===ac && u+w===-b) r={misc:'M2',bad:['p1','p2'],msg:`相乘對了！但相加是 ${num(u+w)}，題目要 ${num(b)}。想一想：哪兩個數相乘還是 ${num(ac)}，加起來卻是 ${num(b)}？`};
    else if(u*w===ac) r={misc:'M3',bad:['p1','p2'],msg:`相乘是 ${num(ac)} 沒錯，但相加是 ${num(u+w)}，不是 ${num(b)}。還有哪些相乘是 ${num(ac)} 的組合？`};
    else if(u*w===-ac) r={misc:'M2',bad:['p1','p2'],msg:`相乘得到 ${num(u*w)}，正負號和 ${num(ac)} 不同。兩數應該同號還是異號？`};
    else if(u+w===b) r={misc:'M3',bad:['p1','p2'],msg:`相加是 ${num(b)} 沒錯，但相乘是 ${num(u*w)}，不是 ${num(ac)}。再找找看。`};
    else r={misc:'M3',bad:['p1','p2'],msg:`這兩數相乘是 ${num(u*w)}、相加是 ${num(u+w)}。要相乘 ${num(ac)}、相加 ${num(b)}，再試試別的組合。`};
  }
  else if(st===3){
    if(!need(['t1','t2'])) return; const t1=pInt(val('t1')), t2=pInt(val('t2')); if(t1===null||t2===null) return fmtErr(['t1','t2']);
    const [m,n]=S.found; const same=(t1===m&&t2===n)||(t1===n&&t2===m);
    if(same && S.mode==='swap' && S.forceFirst!==null && t1!==S.forceFirst){ setFb('info',`拆得沒錯！這次挑戰把 ${term(S.forceFirst,1,true)} 寫在前面，調換一下順序。`); return; }
    if(same){ S.split=[t1,t2]; r={ok:1,msg:`${term(b,1,true)} 拆成 ${term(t1,1,true)} 和 ${term(t2,1,true)}，加回去還是 ${term(b,1,true)}。`}; }
    else if(t1+t2===b) r={misc:'M4',bad:['t1','t2'],msg:`加起來是 ${term(b,1,true)} 沒錯，但要用第 2 步找到的兩個數，為什麼一定要用它們？`};
    else r={misc:'M4',bad:['t1','t2'],msg:`拆開的兩項加起來要等於原本的 ${term(b,1,true)}。第 2 步找到的是哪兩個數？`};
  }
  else if(st===4){
    const ids=['f1','u1','v1','f2','u2','v2']; if(!need(ids)) return;
    const f1=pMono(val('f1')), f2=pMono(val('f2')); const u1=pInt(val('u1')),v1=pInt(val('v1')),u2=pInt(val('u2')),v2=pInt(val('v2'));
    const fmtBad=[]; if(!f1)fmtBad.push('f1'); if(!f2)fmtBad.push('f2'); [['u1',u1],['v1',v1],['u2',u2],['v2',v2]].forEach(([i,v])=>{if(v===null)fmtBad.push(i)});
    if(fmtBad.length) return fmtErr(fmtBad,'公因式可以填 3x、−x、2、−1，或只填「−」；括號內填有正負號的整數。');
    const [t1,t2]=S.split;
    const g1ok=f1.d===1&&f1.k*u1===a&&f1.k*v1===t1, g2ok=f2.d===0&&f2.k*u2===t2&&f2.k*v2===c;
    const f1s=monoText(f1), f2s=monoText(f2);
    const g1html=poly(a,t1,0), g2html=poly(0,t2,c);
    if(!g1ok){
      if(f1.d===0) r={misc:'M6',bad:['f1'],msg:`前兩項 ${g1html} 都有 ${X()}，${X()} 也能一起提出來嗎？`};
      else if(f1.k*u1===a&&f1.k*v1===-t1) r={misc:'M5',bad:['v1'],msg:`把 ${f1s} 乘回括號裡的 ${num(v1)}，會得到原本的 ${term(t1,1,true)} 嗎？正負號再看一次。`};
      else r={misc:'M6',bad:['f1','u1','v1'],msg:`把 ${f1s} 乘回括號裡，會得到原本的 ${g1html} 嗎？`};
    }else if(!g2ok){
      if(f2.d===1) r={misc:'M6',bad:['f2'],msg:`後兩項 ${g2html} 裡的 ${num(c)} 沒有 ${X()}，${X()} 能提出來嗎？`};
      else if(f2.k*u2===t2&&f2.k*v2===-c) r={misc:'M5',bad:['v2'],msg:`把 ${f2s} 乘回括號裡的 ${num(v2)}，會得到原本的 ${num(c)} 嗎？提出負號時，括號裡每一項都要變號嗎？`};
      else r={misc:'M6',bad:['f2','u2','v2'],msg:`把 ${f2s} 乘回括號裡，會得到原本的 ${g2html} 嗎？`};
    }else if(u1!==u2||v1!==v2){
      r={misc:'M6',bad:['f1','f2'],msg:`兩組都算對了！不過兩個括號 ${bin(u1,v1)} 和 ${bin(u2,v2)} 一樣嗎？要提出共同括號，兩組括號要長得一樣。公因式提完了嗎？要不要提出負號？`};
    }else{ S.g={f1,u1,v1,f2,u2,v2}; r={ok:1,msg:`兩組都出現 ${bin(u1,v1)}，可以把它提出來了！`}; }
  }
  else if(st===5){
    const ids=['A','B','C','D']; if(!need(ids)) return; const [A,B,C,D]=ids.map(i=>pInt(val(i)));
    if([A,B,C,D].some(v=>v===null)) return fmtErr(ids);
    const g=S.g;
    if(A&&C&&A*C===a&&A*D+B*C===b&&B*D===c){ S.ans=[[A,B],[C,D]]; r={ok:1,msg:'兩個括號都寫好了！可是這樣分解對不對呢？下一步自己乘開來檢查。'}; }
    else{
      const hasCommon=(A===g.u1&&B===g.v1)||(C===g.u1&&D===g.v1);
      if(hasCommon) r={misc:'M7',bad:(A===g.u1&&B===g.v1)?['C','D']:['A','B'],msg:`共同括號寫對了！提出它之後，兩組前面各剩下什麼？把剩下的合起來，寫成另一個括號。`};
      else r={misc:'M7',bad:ids,msg:`兩組共同的括號是哪一個？先把它整個寫進其中一個括號。`};
    }
  }
  else if(st===6){
    const ids=['e2','e1','e0']; if(!need(ids)) return; const [e2,e1,e0]=ids.map(i=>pInt(val(i)));
    if([e2,e1,e0].some(v=>v===null)) return fmtErr(ids);
    const [[A,B],[C,D]]=S.ans;
    if(e2===A*C&&e1===A*D+B*C&&e0===B*D) r={ok:1,msg:'乘開後就是原式，因式分解正確！'};
    else{

      let msg;
      if(bad.includes('e1')&&bad.length===1) msg=`${X()} 項有兩個來源：外 × 外、內 × 內，兩個都算進去了嗎？正負號呢？`;
      else if(bad.includes('e2')) msg=`${X(true)} 項是哪兩項相乘來的？`;
      else msg=`常數項是哪兩個數相乘來的？正負號對嗎？`;
      r={misc:'M8',bad,msg};
    }
  }
  else if(st===7){
    const ids=['k1','k2']; if(!need(ids)) return; const k1=pInt(val('k1')),k2=pInt(val('k2'));
    if(k1===null||k2===null) return fmtErr(ids);
    const [[A,B],[C,D]]=S.ans;
    if(k1===A*D&&k2===C*B) r={ok:1,msg:'和第 3 步拆出的兩項比比看！'};
    else if(k1===A*B||k2===C*D||k1===C*B) r={misc:'M9',bad:ids,msg:'要斜著乘喔：左上乘右下、左下乘右上。'};
    else r={misc:'M9',bad:ids,msg:'再算一次斜線兩端的數相乘，正負號一起看。'};
  }
  finish(r);
}
function fmtErr(ids,msg){markBad(ids);setFb('info',msg||'請填整數，例如 9 或 −2（負號可用鍵盤的 -）。');}
function finish(r){
  if(r.ok){
    STATS.correct++; setFb('ok',OK+r.msg);
    if(S.step===3 && S.mode!=='swap') lastOrder={key:key(S.prob),second:S.split[1]};
    if(S.step===7){ S.done=true; STATS.solved++; }
    else S.step++;
    hintIdx=0;
    const msg=r.msg; render(); setFb('ok',OK+msg);
  }else{
    STATS.wrong++; STATS.miscon[r.misc]=(STATS.miscon[r.misc]||0)+1;
    markBad(r.bad||[]); setFb('bad',NG+r.msg);
    $('#meStat').textContent=`對 ${STATS.correct}・錯 ${STATS.wrong}・完成 ${STATS.solved} 題`;
  }
  post();
}
function hint(){
  const {a,b,c}=S.prob, ac=S.ac, st=S.step;
  const H={
    1:['首項係數是 x² 前面的數，常數項是最後沒有 x 的數，兩個都要帶著正負號。',`算算看：${a} × ${paren(c)}。`],
    2:[`先列出相乘是 ${num(ac)} 的整數組合（例如 1 和 ${num(ac)}），再一組一組算相加。`,
       ac<0?'相乘是負數，表示兩數一正一負；相加的正負號，由絕對值大的那個數決定。':'相乘是正數，表示兩數同號；相加是正就都正，相加是負就都負。'],
    3:[`把 ${plain(term(b,1,true))} 寫成兩項相加，係數就用第 2 步那兩個數。`],
    4:['前兩項：係數的最大公因數和 x 都提出來。','後兩項：要讓括號和前一組一樣，提出來的數可能要帶負號。'],
    5:['兩組都乘著同一個括號，就像 3 個蘋果 − 1 個蘋果：把「蘋果」提出來。'],
    6:['用分配律：第一個括號的每一項，都乘上第二個括號的每一項，再合併同類項。'],
    7:['左上的數乘右下的數；左下的數乘右上的數。']
  }[st]||[];
  if(!H.length) return;
  const i=Math.min(hintIdx,H.length-1); STATS.hints++; hintIdx++;
  setFb('hint',`提示 ${i+1}／${H.length}：${H[i]}`); post();
}

/* ================= 真實挑戰 ================= */
let CH={total:10,idx:0,probs:[],res:[],tries:0,cur:null,finished:false}; // cur: null 作答中／'ok' 答對／'skip' 跳過
function factorOf(P){ const [m,n]=pairOf(P); const g=gcd(P.a,m), u=P.a/g, v=m/g; return [[u,v],[g,n/u]]; }
function startChallenge(){
  const probs=[]; while(probs.length<10){ const P=genProblem(probs[probs.length-1]); if(!probs.some(q=>key(q)===key(P))) probs.push(P); }
  CH={total:10,idx:0,probs,res:[],tries:0,cur:null,finished:false};
  S={mode:'challenge',prob:probs[0],step:1,done:false};
  renderChallenge(true); setFb('',''); post();
}
function renderChallenge(fresh){

  $('#meSeat').textContent=ME.seat+' 號'+(ME.name?' '+ME.name:'');
  $('#meStat').textContent=`對 ${STATS.correct}・錯 ${STATS.wrong}・完成 ${STATS.solved} 題`;
  const {a,b,c}=S.prob;
  if(CH.finished){
    const ok=CH.res.filter(x=>x&&x!=='skip').length, first=CH.res.filter(x=>x==='ok').length, sk=CH.res.filter(x=>x==='skip').length;
    $('#lines').innerHTML=`<div class="chsum">挑戰完成！答對 ${ok} / ${CH.total} 題<br><span style="font-size:20px;color:var(--ink2)">一次就答對 ${first} 題・跳過 ${sk} 題</span></div>
      <div class="chlist">${CH.probs.map((P,i)=>{const r=CH.res[i];const [[u,v],[g,k]]=factorOf(P);
        return `<div><span class="${r==='skip'?'skm':'okm'}">${r==='skip'?'–':'✓'}</span> ${poly(P.a,P.b,P.c)} = ${bin(u,v)}${bin(g,k)}</div>`;}).join('')}</div>`;
  }else{
    $('#lines').innerHTML=`<div class="chlab">第 ${CH.idx+1} / ${CH.total} 題・因式分解</div>
      <div class="ln l0">${poly(a,b,c)}</div>
      <div class="ln cur"><span class="eq">=</span>(${blank('A','sm')}${X()}&nbsp;${blank('B','sm')})(${blank('C','sm')}${X()}&nbsp;${blank('D','sm')})</div>
      <p class="chtip">不用寫過程，直接寫出答案。需要計算，就在右邊畫板上寫草稿，再自己乘開檢查。</p>`;
  }
  if(fresh||!document.getElementById('pad')) padMount(); else padClear();
  $('#instr').innerHTML=CH.finished?'<span class="step">真實挑戰完成！</span>想再挑戰一次，按「再挑戰一次」。':`<span class="step">真實挑戰・</span>把 ${poly(a,b,c)} 因式分解，直接寫出答案。`;
  chButtons();
  const first=document.querySelector('#lines input.blank'); if(first) setTimeout(()=>{const x=document.activeElement;if(!(x&&x.matches&&x.matches('input.blank')))first.focus({preventScroll:true});},30);
}
function chButtons(){
  const g=$('#gbtns');
  if(CH.finished) g.innerHTML=`<button class="btn primary" data-go="challenge">再挑戰一次</button>`;
  else if(CH.cur) g.innerHTML=`<button class="btn primary" data-go="ch-next">${CH.idx+1<CH.total?'下一題':'看結果'}</button>`;
  else g.innerHTML=`<button class="btn secondary" data-go="ch-skip">跳過</button><button class="btn primary" id="btnCheck">檢查</button>`;
}
function checkChallenge(){
  if(CH.cur||CH.finished) return;
  const ids=['A','B','C','D']; if(!need(ids)) return; const [A,B,C,D]=ids.map(i=>pInt(val(i)));
  if([A,B,C,D].some(v=>v===null)) return fmtErr(ids);
  const {a,b,c}=S.prob;
  const x2=A*C===a, c0=B*D===c, mid=A*D+B*C===b;
  if(A&&C&&x2&&c0&&mid){
    STATS.correct++; STATS.solved++; CH.res[CH.idx]=CH.tries?'ok2':'ok'; CH.cur='ok';
    document.querySelectorAll('#lines input.blank').forEach(i=>{i.disabled=true;i.classList.remove('bad');});
    setFb('ok',OK+(CH.tries?'答對了！':'一次就答對！')); renderChips(); chButtons();
  }else{
    STATS.wrong++; CH.tries++; let k,msg;
    if(x2&&c0){k='C1';msg=`乘開後 ${X(true)} 項和常數項都對了，但 ${X()} 項對不上原式的 ${term(b,1,true)}。想一想：兩個常數換位置，或正負號互換，${X()} 項會怎麼變？`;}
    else if(!x2){k='C2';msg=`兩個括號的 ${X()} 係數相乘，會等於首項係數 ${a} 嗎？`;}
    else {k='C2';msg=`兩個括號的常數相乘，會等於常數項 ${num(c)} 嗎？`;}
    STATS.miscon[k]=(STATS.miscon[k]||0)+1; markBad(ids); setFb('bad',NG+msg);
  }
  $('#meStat').textContent=`對 ${STATS.correct}・錯 ${STATS.wrong}・完成 ${STATS.solved} 題`;
  post();
}
function renderChips(){ const keepFb=$('#fb').innerHTML, kind=$('#fb').className; 
  $('#chips').innerHTML=CH.probs.map((P,i)=>{const r=CH.res[i]; const cls=r==='skip'?'skip':r?'done':(i===CH.idx&&!CH.finished?'cur':'');
    return `<li class="${cls}"><span class="n">${r==='skip'?'–':r?'✓':i+1}</span></li>`;}).join(''); }
function chSkip(){
  if(CH.cur) return; CH.res[CH.idx]='skip'; CH.cur='skip';
  const [[u,v],[g,k]]=factorOf(S.prob);
  document.querySelectorAll('#lines input.blank').forEach(i=>i.disabled=true);
  setFb('info',`已跳過。這題可以分解成 ${bin(u,v)}${bin(g,k)}，在畫板上乘開看看是不是原式。`); renderChips(); chButtons(); post();
}
function chNext(){
  CH.idx++; CH.tries=0; CH.cur=null;
  if(CH.idx>=CH.total){ CH.finished=true; S.done=true; }
  else S.prob=CH.probs[CH.idx];
  renderChallenge(false); setFb('',''); post();
}

const PAD={tool:'pen',color:'#1F2937'};
function padMount(){
  $('#notes').innerHTML=`<div class="pad"><div class="padbar" id="padbar">
    <button data-c="#1F2937" aria-pressed="true" aria-label="黑筆"><span class="dot" style="background:#1F2937"></span></button>
    <button data-c="#1D4ED8" aria-pressed="false" aria-label="藍筆"><span class="dot" style="background:#1D4ED8"></span></button>
    <button data-c="#C2410C" aria-pressed="false" aria-label="橘筆"><span class="dot" style="background:#C2410C"></span></button>
    <button data-t="eraser" aria-pressed="false">橡皮擦</button><span class="sp"></span><button data-t="clear">全部清除</button></div>
    <canvas id="pad" aria-label="草稿畫板"></canvas></div>`;
  PAD.tool='pen'; PAD.color='#1F2937';
  const cv=$('#pad'); requestAnimationFrame(()=>{ cv.width=Math.max(10,cv.clientWidth*2); cv.height=Math.max(10,cv.clientHeight*2); });
  $('#padbar').onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.t==='clear'){padClear();return;}
    PAD.tool=b.dataset.t==='eraser'?'eraser':'pen'; if(b.dataset.c) PAD.color=b.dataset.c;
    document.querySelectorAll('#padbar button[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed',x===b));};
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){} dot(last);};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
  function setup(ctx){ctx.lineCap='round';ctx.lineJoin='round';
    if(PAD.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=40;}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=ctx.fillStyle=PAD.color;ctx.lineWidth=5;}}
  function line(p,q){const ctx=cv.getContext('2d');setup(ctx);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
  function dot(p){const ctx=cv.getContext('2d');setup(ctx);ctx.beginPath();ctx.arc(p[0],p[1],ctx.lineWidth/2,0,Math.PI*2);ctx.fill();}
}
function padClear(){const cv=$('#pad'); if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:TEACHER_EMAIL,password:pw,returnSecureToken:true})});

  if(!r.ok) throw new Error((j.error&&j.error.message)||'ERR');

async function getToken(){
  if(!AUTH) return null;
  if(Date.now()<AUTH.exp) return AUTH.idToken;
  try{
    const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.refreshToken)});
    const j=await r.json(); if(!r.ok) throw 0;
    AUTH={idToken:j.id_token,refreshToken:j.refresh_token,exp:Date.now()+(+j.expires_in-120)*1000}; saveAuth(); return AUTH.idToken;
  }catch(e){ AUTH=null; saveAuth(); return null; }
}

function demoData(){
  if(DEMO) return DEMO;
  const o={}, keys=Object.keys(MISC), now=Date.now();
  for(let i=1;i<=28;i++){
    const c=rint(3,20), w=rint(0,9), mis={}; for(let j=0;j<rint(0,3);j++){const k=keys[rint(0,4)];mis[k]=(mis[k]||0)+rint(1,3);}
    const done=Math.random()<.2;
    o[i]={seat:String(i),name:'',demo:true,mode:['example','swap','practice'][rint(0,2)],step:done?7:rint(1,7),done,correct:c,wrong:w,hints:rint(0,6),solved:rint(0,4),miscon:mis,last:now-(Math.random()<.12?rint(4,10)*60000:rint(5,100)*1000)};
  }
  return DEMO=o;
}
async function exportCsv(){
  const head=['座號','姓名','模式','題目','目前步驟','本題完成','完成題數','答對','答錯','答對率','提示','最常見迷思','最後活動'];
  const rows=lastList.map(s=>{const t=s.correct+s.wrong,m=topMis(s.miscon);
    return [s.seat,s.name||'',MODE_NAMES[s.mode]||'',s.prob||'',s.step,s.done?'是':'否',s.solved,s.correct,s.wrong,t?Math.round(s.correct/t*100)+'%':'',s.hints,m?MISC[m.k]:'',new Date(s.last).toLocaleString('zh-TW')];});
  const csv='﻿'+[head,...rows].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const fname=`首尾相乘拆項_${$('#tRoom').value||'801'}.csv`;
  try{ const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename:fname,data:new Blob([csv],{type:'text/csv'})}); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
}
async function clearClass(){
  const btn=$('#btnClear');
  if(!clearArm){clearArm=true;btn.textContent='再按一次確認清除';btn.style.borderColor='var(--bad)';btn.style.color='var(--bad)';setTimeout(()=>{clearArm=false;btn.textContent='清除本班資料';btn.style.cssText='';},4000);return;}
  clearArm=false;btn.textContent='清除本班資料';btn.style.cssText='';
  const room=$('#tRoom').value.trim()||'801', db=dbUrl();
  if(demoMode){demoMode=false;DEMO=null;$('#btnDemo').textContent='載入範例資料';}
  else if(!db) store(LKEY(room),'{}');
  else{ try{const q=await authQ(); if(q!==null) await fetch(`${db}/fa_cross/${encodeURIComponent(room)}/students.json`+q,{method:'DELETE'});}catch(e){} }
  loadClass();
}

/* ================= 畫面切換 ================= */
function show(id){['login','student','teacher'].forEach(v=>$('#'+v).hidden=v!==id);}
function stuLink(){
  const u=new URL(location.href); u.search=''; const db=dbUrl(); const p=new URLSearchParams();
  if(db&&db!==FIREBASE_DB_URL.replace(/\/+$/,''))p.set('db',db); p.set('room',($('#tRoom').value||$('#inRoom').value).trim()||'801'); u.search=p.toString(); return u.toString();
}
function refreshCfg(){ $('#inDb').value=dbUrl(); $('#stuLink').textContent=stuLink(); }

(function init(){
  const q=new URLSearchParams(location.search); if(q.get('room')) $('#inRoom').value=q.get('room');
  refreshCfg();
  $('#inRoom').addEventListener('input',refreshCfg);
  $('#btnSaveDb').onclick=()=>{const v=$('#inDb').value.trim();store('facross_db',v);$('#dbMsg').textContent=v?'已儲存（此瀏覽器）':'已清除，改用內建資料庫';refreshCfg();};
  $('#btnCopy').onclick=async()=>{const t=$('#stuLink').textContent;try{await navigator.clipboard.writeText(t);$('#btnCopy').textContent='已複製';}catch(e){const r=document.createRange();r.selectNodeContents($('#stuLink'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#btnCopy').textContent='已選取，請按複製';}setTimeout(()=>$('#btnCopy').textContent='複製',2000);};
  $('#btnStart').onclick=()=>{
    const seat=norm($('#inSeat').value), room=$('#inRoom').value.trim();
    if(!room){$('#loginErr').textContent='請填班級代碼。';return;}
    if(!/^\d{1,3}$/.test(seat)||+seat<1){$('#loginErr').textContent='請填座號（數字）。';return;}
    $('#loginErr').textContent='';
    ME={room,seat:String(+seat),name:$('#inName').value.trim().slice(0,12)};
    STATS={correct:0,wrong:0,hints:0,solved:0,miscon:{}};
    try{const old=JSON.parse(store('facross_me_'+room+'_'+ME.seat)||'null');if(old)STATS=old;}catch(e){}
    show('student'); newRound('example');
  };
  $('#inSeat').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btnStart').click();});
  const note=(msg,ok)=>{const el=$('#loginErr');el.textContent=msg||'';el.style.color=ok?'var(--ok)':'';};
  const roomNow=()=>$('#inRoom').value.trim()||'801';
  const openTeacher=()=>{$('#tRoom').value=roomNow();refreshCfg();show('teacher');loadClass();clearInterval(tTimer);tTimer=setInterval(loadClass,3000);};
  const teacherUrl=()=>{const u=new URL(location.href);const p=new URLSearchParams(location.search);p.set('view','teacher');p.set('room',roomNow());u.search=p.toString();u.hash='';return u.toString();};
  // 本視窗內開看板（教師看板視窗本身，或瀏覽器擋下新視窗時）
  const teacherHere=()=>{ if(!needAuth()||AUTH) openTeacher(); else { $('#pwRow').hidden=false; $('#inPw').focus(); } };
  // 按「教師看板」立刻開新視窗（點擊當下直接開目標網址，不會被擋）；密碼在新視窗輸入
  $('#btnTeacher').onclick=()=>{ note('');
    if(IS_TW) return teacherHere();
    let w=null; try{ w=window.open(teacherUrl(),'facross_teacher'); }catch(e){}
    if(w){ try{w.focus();}catch(e){} note(AUTH?'教師看板已在新視窗開啟。':'教師看板已在新視窗開啟，請在新視窗輸入教師密碼。',true); }
    else { note('瀏覽器沒有開出新視窗，改在這個視窗登入看板。'); teacherHere(); } };
  const pwGo=async()=>{ const pw=$('#inPw').value; if(!pw){note('請輸入教師密碼。');return;}
    $('#btnPwGo').disabled=true; note('');
    try{ await signIn(pw); $('#inPw').value=''; $('#pwRow').hidden=true; note(''); openTeacher(); }
    catch(e){ note(authMsg(e.message)); }
    $('#btnPwGo').disabled=false; };
  if(IS_TW){ document.title='教師看板・首尾相乘拆項分組'; $('#btnBack').textContent='關閉視窗';
    $('#btnStart').hidden=true; $('#btnTeacher').hidden=true; document.querySelectorAll('#login .row .field').forEach(f=>{ if(!f.querySelector('#inRoom')&&!f.querySelector('#inPw')) f.hidden=true; });
    if(!needAuth()||AUTH) openTeacher(); else { $('#pwRow').hidden=false; note('教師看板：請輸入教師密碼。',true); setTimeout(()=>$('#inPw').focus(),50); } }
  $('#btnPwGo').onclick=pwGo;
  $('#inPw').addEventListener('keydown',e=>{if(e.key==='Enter')pwGo();});
  $('#btnPwCancel').onclick=()=>{$('#inPw').value='';$('#pwRow').hidden=true;$('#loginErr').textContent='';};
  $('#btnTLogout').onclick=()=>teacherLogout('已登出教師看板。');
  $('#btnBack').onclick=()=>{clearInterval(tTimer); if(IS_TW&&window.opener){window.close();return;} show('login');};
  $('#tRoom').addEventListener('change',()=>{loadClass();refreshCfg();});
  $('#btnDemo').onclick=()=>{demoMode=!demoMode;if(!demoMode)DEMO=null;$('#btnDemo').textContent=demoMode?'關閉範例資料':'載入範例資料';loadClass();};
  $('#btnCsv').onclick=exportCsv;
  $('#btnClear').onclick=clearClass;
  $('#btnLogout').onclick=()=>{ME=null;show('login');};
  $('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)newRound(b.dataset.mode);});
  $('#gbtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='btnCheck')check(); else if(b.id==='btnHint')hint(); else if(b.dataset.go==='ch-next') chNext(); else if(b.dataset.go==='ch-skip') chSkip(); else if(b.dataset.go) newRound(b.dataset.go, b.dataset.go==='swap');});
  $('#student').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input.blank')){e.preventDefault();if(!S.done&&!(S.mode==='challenge'&&CH.cur))check();}});
  $('#student').addEventListener('input',e=>{if(e.target.matches('input.blank'))e.target.classList.remove('bad');});
  if(bc) bc.onmessage=()=>{ if(!$('#teacher').hidden) loadClass(); };
  // 保存個人累計（同一台平板重新整理不歸零）
  setInterval(()=>{if(ME)store('facross_me_'+ME.room+'_'+ME.seat,JSON.stringify(STATS));},2000);
})();
</script>
